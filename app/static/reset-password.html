<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f8fc"><title>Choose a new password — EventHub</title><link rel="stylesheet" href="/static/styles.css"><script src="/static/auth.js" defer></script></head>
<body class="account-page"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">E</span> EventHub</a><a class="text-link" href="/">Back to events <span>↗</span></a></header>
<main class="account-layout account-layout-single"><section class="account-intro"><span class="eyebrow"><span class="eyebrow-dot"></span> SECURE YOUR ACCOUNT</span><h1>Choose a<br>new <span>password.</span></h1><p>Use a password you haven’t used before. Your reset link can only be used once.</p></section>
<form id="reset-form" class="account-card"><span class="eyebrow"><span class="eyebrow-dot"></span> NEW PASSWORD</span><h2>Set new password</h2><p class="account-hint">Choose at least 8 characters.</p><label for="new-password">New password</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><p id="form-error" class="form-error" role="alert" hidden></p><p id="form-success" class="form-success" role="status" hidden></p><button class="button button-primary account-submit" type="submit">Update password <span>→</span></button><p class="account-switch-copy"><a href="/login">Back to sign in</a></p></form></main>
<footer class="footer"><a class="brand footer-brand" href="/"><span class="brand-mark">E</span> EventHub</a><span>Made for getting together.</span><a href="/docs">API documentation ↗</a></footer></body></html>
